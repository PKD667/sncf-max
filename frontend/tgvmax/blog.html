    .blog-cta-banner h2 {

<body>
  <header class="blog-header">
    <h1>📚 Blog <span class="blue-accent">Trainquille</span></h1>
    <p>Conseils, astuces et actualités pour vos voyages TGVmax</p>
  </header>

  <div class="blog-container">
    <!-- CTA Banner en haut -->
    <div class="blog-cta-banner">
      <h2>🚄 Trouvez vos TGVmax disponibles</h2>
      <p>Découvrez toutes les places réservables en temps réel sur une carte claire</p>
      <a href="index.html" class="blog-cta-button">Accéder à Trainquille</a>
    </div>

    <div id="blog-list" class="blog-grid">
      <div class="blog-loading">Chargement des articles...</div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cawdwlqaqnbcvbjaxjin.supabase.co/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhd2R3bHFhcW5iY3ZiamF4amluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyNzkyMzksImV4cCI6MjA3Njg1NTIzOX0.cQwKaHOpYvm-KJzpTimPnf1MZEox0yb9Y-ny4GbqVKc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadBlogs() {
      const blogList = document.getElementById('blog-list');

      try {
        const { data, error } = await supabaseClient
          .from('blogs')
          .select('*')
          .eq('published', true)
          .order('published_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          blogList.innerHTML = '<div class="blog-empty">Aucun article publié pour le moment.</div>';
          return;
        }

        blogList.innerHTML = data.map(blog => `
          <div class="blog-card" onclick="window.location.href='blog-article.html?slug=${blog.slug}'">
            <div class="blog-card-image">📝</div>
            <div class="blog-card-content">
              <h3 class="blog-card-title">${escapeHtml(blog.title)}</h3>
              <p class="blog-card-excerpt">${escapeHtml(blog.excerpt || blog.content.substring(0, 150) + '...')}</p>
              <div class="blog-card-meta">
                <span>${formatDate(blog.published_at || blog.created_at)}</span>
                <span>${blog.reading_time || Math.ceil(blog.content.length / 1000)} min</span>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Erreur chargement blogs:', error);
        blogList.innerHTML = '<div class="blog-empty">Erreur lors du chargement des articles.</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('fr-FR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    loadBlogs();
  </script>
</body>
